<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;

        if (/android/i.test(userAgent)) {
            window.location.href = 'intent://jisungeda55.github.io/newsroom/#Intent;scheme=https;package=com.android.chrome;end;';
        } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
            window.open('https://jisungeda55.github.io/newsroom/', '_blank');
        } else {
            window.location.href = 'https://jisungeda55.github.io/newsroom/';
        }
    });
    </script>
</head>
