<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#019A6C">
  <meta name="description" content="해솔종합상사 보도자료 아카이브">
  <title>공개자료 | 해솔종합상사</title>
  <link rel="icon" href="https://i.ibb.co/W4yMPcKQ/favicon.webp" type="image/webp">
  <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
  <style>
    @font-face {
      font-family: "LINESeedKR";
      src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Bd.woff2") format("woff2");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "MBC1961M";
      src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-01@1.0/MBC1961M.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --ink: #111827;
      --ink-soft: #4b5563;
      --muted: #747b86;
      --accent: #019A6C;
      --accent-hover: #017b57;
      --line: #e5e7eb;
      --line-strong: #d1d5db;
      --surface: #ffffff;
      --surface-soft: #f7f8fa;
      --page: #ffffff;
      --radius: 18px;
      --content-width: 1240px;
      --shadow-soft: 0 8px 28px rgba(17, 24, 39, .055);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; scroll-padding-top: 150px; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
      font-weight: 400;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font: inherit; }
    button, a, input, select { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(1, 154, 108, .28);
      outline-offset: 3px;
    }
    .skip-link {
      position: fixed; left: 12px; top: 12px; z-index: 1000;
      transform: translateY(-160%); padding: 10px 14px; border-radius: 8px;
      background: var(--accent); color: #fff; text-decoration: none;
    }
    .skip-link:focus { transform: translateY(0); }

    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255, 255, 255, .94);
      border-bottom: 1px solid rgba(229, 231, 235, .9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .header-inner {
      width: min(var(--content-width), calc(100% - 64px));
      margin: 0 auto;
      padding: 12px 0 9px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 40px;
      align-items: center;
      gap: 9px 20px;
    }
    .brand {
      display: inline-flex; align-items: center; justify-self: start;
      min-width: 0; max-width: 100%; text-decoration: none;
    }
    .brand-logo {
      display: block; width: auto; height: auto;
      max-width: min(260px, 52vw); max-height: 42px;
      object-fit: contain; object-position: left center;
    }
    .brand-fallback {
      display: inline-flex; align-items: center; gap: 10px;
      min-width: 0; color: var(--ink); white-space: nowrap;
    }
    .brand-globe {
      display: grid; place-items: center; flex: 0 0 38px;
      width: 38px; height: 38px; color: var(--accent);
    }
    .brand-globe .icon { width: 35px; height: 35px; }
    .brand-name {
      min-width: 0; font-size: clamp(17px, 2vw, 22px); font-weight: 800;
      letter-spacing: -.06em; line-height: 1.2;
    }
    .main-nav {
      grid-column: 1 / -1; display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: stretch; gap: 8px;
      padding: 10px 0 1px; border-top: 1px solid var(--line);
    }
    .nav-item {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      min-width: 0; min-height: 58px; padding: 8px 10px;
      border: 1px solid transparent; border-radius: 12px;
      color: #4b5563; text-decoration: none;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }
    .nav-item:hover {
      color: var(--accent); background: rgba(1, 154, 108, .055);
    }
    .nav-item[aria-current="page"] {
      color: var(--accent); background: rgba(1, 154, 108, .075);
      border-color: rgba(1, 154, 108, .16);
    }
    .nav-image-wrap {
      position: relative; display: grid; place-items: center;
      width: 35px; height: 35px; flex: 0 0 35px;
      overflow: hidden; border-radius: 9px; background: #e8f6f0;
    }
    .nav-image { display: block; width: 100%; height: 100%; object-fit: cover; }
    .nav-image-fallback {
      display: grid; place-items: center; width: 100%; height: 100%;
      color: var(--accent); font-size: 13px; font-weight: 800;
    }
    .nav-label {
      display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-size: 13px; font-weight: 700; letter-spacing: -.035em;
    }
    .header-search-link {
      width: 40px; height: 40px; display: grid; place-items: center;
      background: transparent; border: 1px solid var(--line); border-radius: 50%;
      cursor: pointer; transition: background .2s, border-color .2s;
    }
    .header-search-link:hover { background: var(--surface-soft); border-color: var(--line-strong); }
    .icon { width: 19px; height: 19px; display: block; }
    h1, .brand-name, .brand-sub, .eyebrow, .filter-label, .card-title, .status-panel h2, .footer-brand {
      font-family: "LINESeedKR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    main { min-height: 62vh; }
    .page-intro {
      background: linear-gradient(180deg, #f8f9fc 0%, #fff 100%);
      border-bottom: 1px solid #eef0f4;
    }
    .intro-inner { width: min(var(--content-width), calc(100% - 64px)); margin: 0 auto; padding: 54px 0 43px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 9px;
      color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .15em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; display: block; width: 23px; height: 2px; background: var(--accent); }
    h1 {
      margin: 13px 0 10px; font-size: clamp(38px, 5vw, 58px);
      line-height: 1.15; letter-spacing: -.075em; font-weight: 700;
    }
    .page-description { margin: 0; color: var(--ink-soft); font-size: 16px; color: #008b62; font-weight: bold; letter-spacing: -.025em; }
    .intro-meta { display: flex; align-items: center; gap: 12px; margin-top: 28px; color: var(--muted); font-size: 12px; }
    .meta-dot { width: 3px; height: 3px; border-radius: 50%; background: #9ca3af; }

    .content-wrap { width: min(var(--content-width), calc(100% - 64px)); margin: 0 auto; padding: 36px 0 88px; }
    .toolbar { display: grid; grid-template-columns: minmax(240px, 1fr) auto; gap: 14px; align-items: center; }
    .search-box {
      min-height: 54px; display: flex; align-items: center; gap: 12px;
      padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 12px;
      background: #fff; transition: border-color .18s, box-shadow .18s;
    }
    .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(1, 154, 108, .09); }
    .search-box .icon { color: #6b7280; flex: 0 0 auto; }
    .search-box input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 14px; }
    .search-box input::placeholder { color: #9ca3af; }
    .search-submit {
      min-height: 42px; padding: 0 20px; border: 0; border-radius: 8px;
      background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
      transition: background .18s, transform .18s;
    }
    .search-submit:hover { background: var(--accent-hover); }
    .search-submit:active { transform: scale(.98); }
    .filter-area { margin-top: 20px; padding: 19px 0 22px; border-bottom: 1px solid var(--line); }
    .filter-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px 20px; }
    .filter-label { color: #374151; font-size: 13px; font-weight: 700; }
    .period-pills { display: flex; flex-wrap: wrap; gap: 7px; }
    .period-pill {
      min-height: 34px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px;
      background: #fff; color: #6b7280; font-size: 12px; cursor: pointer;
      transition: color .18s, background .18s, border-color .18s;
    }
    .period-pill:hover { border-color: #aab1c0; color: var(--ink); }
    .period-pill[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
    .custom-dates { display: none; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .custom-dates.is-visible { display: flex; }
    .custom-dates label { color: var(--muted); font-size: 12px; }
    .custom-dates input {
      min-height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px;
      background: #fff; color: var(--ink); font-size: 12px;
    }
    .small-button {
      min-height: 36px; padding: 0 13px; border: 1px solid var(--line-strong); border-radius: 7px;
      background: #fff; font-size: 12px; cursor: pointer;
    }
    .small-button:hover { background: var(--surface-soft); }

    .results-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 28px 0 18px; }
    .result-count { font-size: 14px; color: #4b5563; }
    .result-count strong { color: var(--ink); font-weight: 700; }
    .result-actions { display: flex; align-items: center; gap: 10px; }
    .result-note { font-size: 12px; color: var(--muted); }
    .sort-select {
      min-height: 38px; padding: 0 32px 0 11px; border: 1px solid var(--line); border-radius: 8px;
      background-color: #fff; color: #4b5563; font-size: 12px; cursor: pointer;
    }
    .article-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .article-card {
      min-width: 0; display: flex; flex-direction: column; min-height: 268px;
      padding: 24px 23px 19px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); text-decoration: none; overflow: hidden;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
      animation: card-in .34s both;
    }
    .article-card:hover { transform: translateY(-4px); border-color: #cbd1df; box-shadow: var(--shadow-soft); }
    .card-topline { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 17px; }
    .card-category {
      display: inline-flex; align-items: center; gap: 6px; color: var(--accent);
      font-size: 11px; line-height: 1.5; font-weight: 700; letter-spacing: .01em;
    }
    .card-category::before { content: ""; display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .card-number { color: #b4bac5; font-size: 11px; font-variant-numeric: tabular-nums; }
    .card-title { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.055em; line-height: 1.5; overflow-wrap: anywhere; }
    .article-card:hover .card-title { color: var(--accent); }
    .card-description {
      margin: 12px 0 24px; color: #687180; font-size: 13px; line-height: 1.8;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      overflow-wrap: anywhere;
    }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 14px; border-top: 1px solid #f0f1f4; }
    .card-date { color: #858c98; font-size: 11px; font-variant-numeric: tabular-nums; }
    .card-arrow { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #f5f6f9; color: #4b5563; flex: 0 0 auto; transition: color .18s, background .18s, transform .18s; }
    .article-card:hover .card-arrow { background: var(--accent); color: #fff; transform: translateX(2px); }

    .status-panel {
      padding: 54px 22px; border: 1px dashed var(--line-strong); border-radius: var(--radius);
      color: var(--ink-soft); text-align: center; background: #fcfcfd;
    }
    .status-icon { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 13px; border-radius: 50%; background: #e8f6f0; color: var(--accent); }
    .status-panel h2 { margin: 0 0 5px; color: var(--ink); font-size: 17px; letter-spacing: -.03em; }
    .status-panel p { margin: 0; font-size: 13px; }
    .status-panel .small-button { margin-top: 17px; }
    .pagination { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 34px; }
    .page-button {
      min-width: 37px; height: 37px; padding: 0 9px; display: inline-grid; place-items: center;
      border: 1px solid transparent; border-radius: 9px; background: transparent; color: #6b7280;
      font-size: 12px; cursor: pointer; transition: background .18s, color .18s, border-color .18s;
    }
    .page-button:hover:not(:disabled) { background: var(--surface-soft); color: var(--ink); }
    .page-button[aria-current="page"] { background: var(--accent); color: #fff; }
    .page-button:disabled { opacity: .35; cursor: not-allowed; }

    .site-footer { background: #f7f8fa; border-top: 1px solid var(--line); }
    .footer-inner { width: min(var(--content-width), calc(100% - 64px)); margin: 0 auto; padding: 27px 0 30px; }
    .footer-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .footer-brand { font-size: 13px; font-weight: 700; letter-spacing: -.03em; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 16px; }
    .footer-links a { color: #697180; font-size: 11px; text-decoration: none; }
    .footer-links a:hover { color: var(--accent); }
    .footer-bottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 18px; margin-top: 17px; padding-top: 14px; border-top: 1px solid #e7e9ee; color: #9298a3; font-size: 10px; }
    .to-top { display: inline-flex; align-items: center; gap: 6px; color: #697180; text-decoration: none; font-size: 11px; }
    .to-top:hover { color: var(--accent); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @keyframes card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    @media (max-width: 900px) {
      .header-inner, .intro-inner, .content-wrap, .footer-inner { width: min(100% - 40px, var(--content-width)); }
      .main-nav { gap: 4px; }
      .nav-item { gap: 7px; padding: 8px 5px; }
      .nav-image-wrap { width: 31px; height: 31px; flex-basis: 31px; }
      .nav-label { font-size: 12px; }
      .article-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .article-card { min-height: 252px; }
    }
    @media (max-width: 620px) {
      html { scroll-padding-top: 140px; }
      .header-inner {
        width: calc(100% - 32px); gap: 8px 8px; padding: 10px 0 8px;
        grid-template-columns: minmax(0, 1fr) 36px;
      }
      .brand-logo { max-width: min(230px, calc(100vw - 100px)); max-height: 38px; }
      .brand-fallback { gap: 7px; }
      .brand-globe { width: 30px; height: 30px; flex-basis: 30px; }
      .brand-globe .icon { width: 28px; height: 28px; }
      .brand-name { font-size: clamp(15px, 4.6vw, 19px); }
      .main-nav { gap: 3px; padding-top: 8px; }
      .nav-item {
        flex-direction: column; justify-content: center; gap: 5px;
        min-height: 65px; padding: 6px 1px; border-radius: 9px;
      }
      .nav-image-wrap { width: 28px; height: 28px; flex-basis: 28px; border-radius: 7px; }
      .nav-image-fallback { font-size: 11px; }
      .nav-label { max-width: 100%; font-size: 10px; line-height: 1.25; letter-spacing: -.045em; }
      .header-search-link { width: 34px; height: 34px; }
      .intro-inner { width: calc(100% - 36px); padding: 38px 0 30px; }
      h1 { margin-top: 11px; font-size: 41px; }
      .page-description { font-size: 13px; line-height: 1.75; }
      .intro-meta { margin-top: 20px; font-size: 11px; }
      .content-wrap { width: calc(100% - 32px); padding: 25px 0 60px; }
      .toolbar { grid-template-columns: minmax(0, 1fr); gap: 9px; }
      .search-box { min-height: 50px; padding: 0 13px; }
      .search-submit { min-height: 45px; }
      .filter-area { margin-top: 17px; padding-top: 16px; }
      .filter-top { align-items: flex-start; flex-direction: column; gap: 12px; }
      .period-pills { gap: 6px; }
      .period-pill { min-height: 32px; padding: 0 11px; font-size: 11px; }
      .custom-dates { gap: 7px; }
      .custom-dates input { flex: 1 1 130px; min-width: 0; }
      .results-top { align-items: flex-start; margin-top: 23px; }
      .result-count { padding-top: 5px; font-size: 12px; }
      .result-note { display: none; }
      .sort-select { min-height: 34px; font-size: 11px; }
      .article-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .article-card { min-height: 0; padding: 20px 19px 15px; border-radius: 14px; }
      .card-topline { margin-bottom: 12px; }
      .card-title { font-size: 18px; line-height: 1.5; }
      .card-description { margin: 8px 0 17px; font-size: 12px; -webkit-line-clamp: 2; }
      .card-footer { padding-top: 12px; }
      .pagination { margin-top: 24px; gap: 3px; }
      .page-button { min-width: 34px; height: 34px; }
      .footer-inner { width: calc(100% - 32px); padding: 22px 0 24px; }
      .footer-top { align-items: flex-start; flex-direction: column; gap: 12px; }
      .footer-links { gap: 14px; }
      .footer-bottom { margin-top: 14px; font-size: 9px; }
    }
  </style>
</head>
<body id="top">
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" id="brand-home" href="#top" aria-label="해솔종합상사 홈">
        <img class="brand-logo" id="brand-logo" alt="해솔종합상사 로고" hidden>
        <span class="brand-fallback" id="brand-fallback">
          <span class="brand-globe" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M2.9 12h18.2M12 2.8c2.4 2.5 3.6 5.6 3.6 9.2s-1.2 6.7-3.6 9.2C9.6 18.7 8.4 15.6 8.4 12S9.6 5.3 12 2.8Z" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </span>
          <span class="brand-name" id="brand-name">해솔종합상사</span>
        </span>
      </a>
      <button class="header-search-link" id="focus-search" type="button" aria-label="보도자료 검색으로 이동">
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.4 4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <nav class="main-nav" id="main-nav" aria-label="주요 메뉴"></nav>
    </div>
  </header>

  <main id="main-content">
    <section class="page-intro" aria-labelledby="page-title">
      <div class="intro-inner">
        <div class="eyebrow">newsroom</div>
        <h1 id="page-title">공개자료</h1>
        <p class="page-description">스트리머 해솔이오24의 주요 소식과 자료를 확인하세요.</p>
        <div class="intro-meta" aria-label="페이지 정보">
          <span>PUBLISHED MATERIALS</span><span class="meta-dot" aria-hidden="true"></span>
          <span id="intro-total">자료를 불러오는 중</span>
        </div>
      </div>
    </section>

    <section class="content-wrap" id="press-list" aria-label="보도자료 목록">
      <form class="toolbar" id="search-form" role="search">
        <label class="search-box" for="search-input">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.4 4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search-input" name="q" type="search" placeholder="검색어를 입력하세요" autocomplete="off" aria-label="보도자료 제목과 설명 검색">
        </label>
        <button class="search-submit" type="submit">검색</button>
      </form>

      <div class="filter-area">
        <div class="filter-top">
          <span class="filter-label">기간 설정</span>
          <div class="period-pills" role="group" aria-label="게시 기간 필터">
            <button class="period-pill" type="button" data-period="all" aria-pressed="true">전체 날짜</button>
            <button class="period-pill" type="button" data-period="7" aria-pressed="false">1주일</button>
            <button class="period-pill" type="button" data-period="30" aria-pressed="false">1개월</button>
            <button class="period-pill" type="button" data-period="365" aria-pressed="false">1년</button>
            <button class="period-pill" type="button" data-period="custom" aria-pressed="false">직접 설정</button>
          </div>
        </div>
        <div class="custom-dates" id="custom-dates" aria-label="직접 기간 설정">
          <label for="date-from">시작일</label>
          <input id="date-from" type="date">
          <label for="date-to">종료일</label>
          <input id="date-to" type="date">
          <button class="small-button" id="apply-date" type="button">적용</button>
          <button class="small-button" id="clear-filters" type="button">초기화</button>
        </div>
      </div>

      <div class="results-top">
        <div class="result-count" id="result-count" aria-live="polite">보도자료 <strong>—</strong>건</div>
        <div class="result-actions">
          <span class="result-note" id="result-note">최신 보도자료부터 표시합니다.</span>
          <label class="sr-only" for="sort-select">정렬 방법</label>
          <select id="sort-select" class="sort-select">
            <option value="newest">최신순</option>
            <option value="oldest">오래된순</option>
          </select>
        </div>
      </div>

      <div id="article-grid" class="article-grid" aria-live="polite" aria-busy="true">
        <div class="status-panel" style="grid-column:1/-1">
          <div class="status-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.64 5.64l2.12 2.12m8.48 8.48 2.12 2.12m0-12.72-2.12 2.12m-8.48 8.48-2.12 2.12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
          <h2>보도자료를 불러오고 있습니다</h2><p>잠시만 기다려 주세요.</p>
        </div>
      </div>
      <nav class="pagination" id="pagination" aria-label="보도자료 페이지 이동" hidden></nav>
    </section>
  </main>

  <footer class="site-footer" id="site-footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-brand">해솔종합상사 뉴스룸</div>
        <nav class="footer-links" aria-label="하단 메뉴">
          <a href="mailto:ccnaver@naver.com">· Contact US ·</a>
          <a href="https://chzzk.naver.com/c68c3e1788d86ff11740edcd7040a8e8/videos?videoType=&sortType=LATEST&page=1" target="_blank" rel="noopener noreferrer">Chzzk ↗</a>
          <a href="https://github.com/JisungEda55/pressnote" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        </nav>
      </div>
      <div class="footer-bottom">
        <span>© <span id="footer-year">2026</span> 해솔종합상사. All rights reserved.</span>
        <span id="updated-date">보도자료 데이터는 공개 저장소에서 불러옵니다.</span>
        <a class="to-top" href="#top">맨 위로 ↑</a>
      </div>
    </div>
  </footer>

  <script>
    (() => {
      "use strict";

      const DATA_URL = "https://raw.githubusercontent.com/JisungEda55/pressnote/refs/heads/main/list/press.json";
      const GITHUB_ARTICLE_BASE = "https://github.com/JisungEda55/pressnote/blob/main/pressnote/";
      const PUBLIC_ARTICLE_BASE = "https://jisungeda55.github.io/pressnote/pressnote/";
      const PAGE_SIZE = 9;

      // =============================================================
      // 브랜드 로고 설정
      // logoUrl에 6110×1060 비율(약 5.76:1)의 이미지 URL을 입력하세요.
      // 비워 두거나 이미지 로딩에 실패하면 지구본 아이콘 + 이름을 표시합니다.
      // =============================================================
      const BRAND = {
        name: "해솔종합상사",
        logoUrl: "https://i.ibb.co/5hTWkyZM/GSMBTXHSCP.webp"
      };

      // =============================================================
      // 메인 메뉴 설정: 항목은 정확히 5개입니다.
      // label = 버튼 텍스트 / imageUrl = 정사각형 이미지 URL / url = 클릭 후 이동할 주소
      // 아래 주소는 현재 페이지에서 작동하는 예시 앵커입니다. 실제 페이지 주소로 바꿔 주세요.
      // imageUrl이 비어 있거나 이미지 로딩에 실패하면 텍스트 첫 글자가 대체 표시됩니다.
      // =============================================================
      const NAV_ITEMS = [
        { label: "치지직", imageUrl: "https://ssl.pstatic.net/static/nng/glive/icon/favicon.png", url: "https://chzzk.naver.com/c68c3e1788d86ff11740edcd7040a8e8" },
        { label: "유튜브", imageUrl: "https://www.gstatic.com/youtube/img/branding/favicon/favicon_144x144_v2.png", url: "https://www.youtube.com/" },
        { label: "인스타그램", imageUrl: "https://static.cdninstagram.com/rsrc.php/y4/r/QaBlI0OZiks.ico", url: "#site-footer" },
        { label: "X (엑스)", imageUrl: "https://x.com/favicon.ico", url: "#press-list" },
        { label: "네이버카페", imageUrl: "https://m.cafe.naver.com/favicon.ico", url: "#site-footer" }
      ];

      const els = {
        grid: document.getElementById("article-grid"),
        pagination: document.getElementById("pagination"),
        searchForm: document.getElementById("search-form"),
        searchInput: document.getElementById("search-input"),
        dateFrom: document.getElementById("date-from"),
        dateTo: document.getElementById("date-to"),
        customDates: document.getElementById("custom-dates"),
        resultCount: document.getElementById("result-count"),
        resultNote: document.getElementById("result-note"),
        sort: document.getElementById("sort-select"),
        introTotal: document.getElementById("intro-total"),
        updatedDate: document.getElementById("updated-date"),
        footerYear: document.getElementById("footer-year")
      };

      function safeImageUrl(value) {
        if (typeof value !== "string" || !value.trim()) return "";
        try {
          const url = new URL(value.trim(), window.location.href);
          return ["https:", "http:"].includes(url.protocol) ? url.href : "";
        } catch (_) {
          return "";
        }
      }

      function safeNavigationUrl(value) {
        if (typeof value !== "string" || !value.trim()) return null;
        const candidate = value.trim();
        if (candidate.startsWith("#")) return candidate;
        try {
          const url = new URL(candidate, window.location.href);
          return ["https:", "http:", "mailto:"].includes(url.protocol) ? url.href : null;
        } catch (_) {
          return null;
        }
      }

      function renderBrand() {
        const name = typeof BRAND.name === "string" && BRAND.name.trim() ? BRAND.name.trim() : "해솔종합상사";
        const brandHome = document.getElementById("brand-home");
        const logo = document.getElementById("brand-logo");
        const fallback = document.getElementById("brand-fallback");
        const nameNode = document.getElementById("brand-name");
        nameNode.textContent = name;
        brandHome.setAttribute("aria-label", `${name} 홈`);
        logo.alt = `${name} 로고`;

        const logoUrl = safeImageUrl(BRAND.logoUrl);
        if (!logoUrl) {
          logo.hidden = true;
          fallback.hidden = false;
          return;
        }

        logo.addEventListener("load", () => {
          logo.hidden = false;
          fallback.hidden = true;
        }, { once: true });
        logo.addEventListener("error", () => {
          logo.hidden = true;
          fallback.hidden = false;
        }, { once: true });
        logo.src = logoUrl;
      }

      function renderMainNav() {
        const nav = document.getElementById("main-nav");
        nav.replaceChildren();
        NAV_ITEMS.slice(0, 5).forEach((item, index) => {
          const link = document.createElement("a");
          link.className = "nav-item";
          const targetUrl = safeNavigationUrl(item.url);
          if (targetUrl) {
            link.href = targetUrl;
          } else {
            link.href = "#top";
            link.setAttribute("aria-disabled", "true");
            link.title = "스크립트의 url 설정을 확인해 주세요.";
          }
          if (item.current) link.setAttribute("aria-current", "page");
          const label = typeof item.label === "string" && item.label.trim() ? item.label.trim() : `메뉴 ${index + 1}`;
          link.setAttribute("aria-label", `${label}로 이동`);

          const imageWrap = document.createElement("span");
          imageWrap.className = "nav-image-wrap";
          imageWrap.setAttribute("aria-hidden", "true");
          const fallback = document.createElement("span");
          fallback.className = "nav-image-fallback";
          fallback.textContent = Array.from(label)[0] || String(index + 1);
          const image = document.createElement("img");
          image.className = "nav-image";
          image.alt = "";
          image.decoding = "async";
          image.hidden = true;
          image.addEventListener("load", () => {
            image.hidden = false;
            fallback.hidden = true;
          });
          image.addEventListener("error", () => {
            image.hidden = true;
            fallback.hidden = false;
          });
          const imageUrl = safeImageUrl(item.imageUrl);
          if (imageUrl) image.src = imageUrl;
          imageWrap.append(image, fallback);

          const text = document.createElement("span");
          text.className = "nav-label";
          text.textContent = label;
          link.append(imageWrap, text);
          nav.appendChild(link);
        });
      }

      const state = {
        articles: [],
        filtered: [],
        page: 1,
        query: "",
        period: "all",
        customFrom: null,
        customTo: null,
        sort: "newest",
        loading: false,
        error: null
      };

      const dateFormatter = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric", month: "long", day: "numeric"
      });
      function parseReleaseDate(value) {
        if (typeof value !== "string" || !value.trim()) return null;
        // 현재 데이터 형식: YYYY-MM-DD-HH-MM. ISO 날짜도 함께 허용합니다.
        const match = value.trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:-(\d{1,2})-(\d{1,2}))?$/);
        if (match) {
          const [, y, mo, d, h = "0", mi = "0"] = match;
          const date = new Date(Number(y), Number(mo) - 1, Number(d), Number(h), Number(mi));
          if (date.getFullYear() === Number(y) && date.getMonth() === Number(mo) - 1 && date.getDate() === Number(d)) return date;
          return null;
        }
        const parsed = new Date(value);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
      }

      function safeArticleUrl(value) {
        if (typeof value !== "string" || !value.trim()) return null;
        let candidate = value.trim();
        if (candidate.startsWith(GITHUB_ARTICLE_BASE)) {
          candidate = PUBLIC_ARTICLE_BASE + candidate.slice(GITHUB_ARTICLE_BASE.length);
        }
        try {
          const url = new URL(candidate);
          if (url.protocol !== "https:") return null;
          return url.href;
        } catch (_) {
          return null;
        }
      }

      function normalizeArticle(raw, index) {
        if (!raw || typeof raw !== "object") return null;
        const title = typeof raw.title === "string" ? raw.title.trim() : "";
        const description = typeof raw.description === "string" ? raw.description.trim() : "";
        const url = safeArticleUrl(raw.url);
        const releaseDate = parseReleaseDate(raw.releaseDate);
        if (!title || !url) return null;
        const possibleCategory = raw.category ?? raw.section ?? raw.type ?? "";
        return {
          id: `${index}-${title.slice(0, 24)}`,
          title,
          description,
          url,
          releaseDate,
          dateLabel: releaseDate ? dateFormatter.format(releaseDate) : "게시일 미등록",
          searchText: `${title} ${description}`.toLocaleLowerCase("ko-KR"),
          category: typeof possibleCategory === "string" ? possibleCategory.trim() : ""
        };
      }

      function setStatus(title, description, options = {}) {
        const panel = document.createElement("div");
        panel.className = "status-panel";
        panel.style.gridColumn = "1 / -1";
        const iconWrap = document.createElement("div");
        iconWrap.className = "status-icon";
        iconWrap.setAttribute("aria-hidden", "true");
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("class", "icon");
        svg.setAttribute("fill", "none");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", options.error ? "M12 8v5m0 3h.01M10.3 3.9 1.9 18.5A1.7 1.7 0 0 0 3.4 21h17.2a1.7 1.7 0 0 0 1.5-2.5L13.7 3.9a2 2 0 0 0-3.4 0Z" : "M4 12h16M12 4v16");
        path.setAttribute("stroke", "currentColor");
        path.setAttribute("stroke-width", "1.7");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        svg.appendChild(path);
        iconWrap.appendChild(svg);
        const heading = document.createElement("h2");
        heading.textContent = title;
        const paragraph = document.createElement("p");
        paragraph.textContent = description;
        panel.append(iconWrap, heading, paragraph);
        if (options.retry) {
          const retry = document.createElement("button");
          retry.className = "small-button";
          retry.type = "button";
          retry.textContent = "다시 불러오기";
          retry.addEventListener("click", loadArticles);
          panel.appendChild(retry);
        }
        els.grid.replaceChildren(panel);
        els.grid.setAttribute("aria-busy", state.loading ? "true" : "false");
        els.pagination.hidden = true;
      }

      async function loadArticles() {
        if (state.loading) return;
        state.loading = true;
        state.error = null;
        setStatus("보도자료를 불러오고 있습니다", "잠시만 기다려 주세요.");
        try {
          const response = await fetch(DATA_URL, {
            method: "GET",
            mode: "cors",
            cache: "no-cache",
            headers: { "Accept": "application/json" }
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const json = await response.json();
          if (!Array.isArray(json)) throw new Error("JSON 형식이 배열이 아닙니다.");
          state.articles = json.map(normalizeArticle).filter(Boolean);
          if (!state.articles.length) {
            state.loading = false;
            state.error = new Error("표시할 수 있는 보도자료가 없습니다.");
            els.introTotal.textContent = "등록된 자료 없음";
            updateFilters();
            setStatus("표시할 보도자료가 없습니다", "저장소의 JSON 데이터와 기사 URL을 확인해 주세요.", { error: true, retry: true });
            return;
          }
          state.loading = false;
          state.error = null;
          els.introTotal.textContent = `총 ${state.articles.length.toLocaleString("ko-KR")}건의 자료`;
          els.updatedDate.textContent = `데이터 확인: ${dateFormatter.format(new Date())}`;
          applyFilters();
        } catch (error) {
          state.loading = false;
          state.error = error;
          console.error("보도자료를 불러오지 못했습니다.", error);
          els.introTotal.textContent = "자료를 불러오지 못했습니다";
          els.resultCount.textContent = "데이터를 불러오지 못했습니다.";
          setStatus("보도자료를 불러오지 못했습니다", "네트워크 연결 또는 공개 저장소의 JSON 주소를 확인한 뒤 다시 시도해 주세요.", { error: true, retry: true });
        }
      }

      function updateFilters() {
        state.query = els.searchInput.value.trim().toLocaleLowerCase("ko-KR");
        state.sort = els.sort.value;
      }

      function periodRange() {
        const now = new Date();
        if (state.period === "custom") return { from: state.customFrom, to: state.customTo };
        if (state.period === "all") return { from: null, to: null };
        const days = Number(state.period);
        if (!Number.isFinite(days)) return { from: null, to: null };
        const from = new Date(now);
        from.setDate(from.getDate() - days);
        from.setHours(0, 0, 0, 0);
        now.setHours(23, 59, 59, 999);
        return { from, to: now };
      }

      function applyFilters() {
        updateFilters();
        const { from, to } = periodRange();
        let results = state.articles.filter(article => {
          if (state.query && !article.searchText.includes(state.query)) return false;
          if ((from || to) && !article.releaseDate) return false;
          if (from && article.releaseDate < from) return false;
          if (to && article.releaseDate > to) return false;
          return true;
        });
        results.sort((a, b) => {
          const aTime = a.releaseDate ? a.releaseDate.getTime() : (state.sort === "newest" ? -Infinity : Infinity);
          const bTime = b.releaseDate ? b.releaseDate.getTime() : (state.sort === "newest" ? -Infinity : Infinity);
          return state.sort === "oldest" ? aTime - bTime : bTime - aTime;
        });
        state.filtered = results;
        state.page = Math.min(state.page, Math.max(1, Math.ceil(results.length / PAGE_SIZE)));
        renderArticles();
      }

      function createArticleCard(article, index) {
        const link = document.createElement("a");
        link.className = "article-card";
        link.href = article.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.setAttribute("aria-label", `${article.title}, 새 탭에서 열기`);
        link.style.animationDelay = `${Math.min(index, 8) * 35}ms`;

        const top = document.createElement("div");
        top.className = "card-topline";
        const category = document.createElement("span");
        category.className = "card-category";
        category.textContent = article.category || "보도자료";
        const number = document.createElement("span");
        number.className = "card-number";
        number.textContent = String((state.page - 1) * PAGE_SIZE + index + 1).padStart(2, "0");
        top.append(category, number);

        const title = document.createElement("h2");
        title.className = "card-title";
        title.textContent = article.title;
        const description = document.createElement("p");
        description.className = "card-description";
        description.textContent = article.description || "자세한 내용은 보도자료에서 확인하실 수 있습니다.";
        const footer = document.createElement("div");
        footer.className = "card-footer";
        const date = document.createElement("span");
        date.className = "card-date";
        date.textContent = article.dateLabel;
        const arrow = document.createElement("span");
        arrow.className = "card-arrow";
        arrow.setAttribute("aria-hidden", "true");
        const arrowSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        arrowSvg.setAttribute("class", "icon");
        arrowSvg.setAttribute("viewBox", "0 0 24 24");
        arrowSvg.setAttribute("fill", "none");
        const arrowPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        arrowPath.setAttribute("d", "M5 12h14m-6-6 6 6-6 6");
        arrowPath.setAttribute("stroke", "currentColor");
        arrowPath.setAttribute("stroke-width", "1.7");
        arrowPath.setAttribute("stroke-linecap", "round");
        arrowPath.setAttribute("stroke-linejoin", "round");
        arrowSvg.appendChild(arrowPath);
        arrow.appendChild(arrowSvg);
        footer.append(date, arrow);
        link.append(top, title, description, footer);
        return link;
      }

      function createPageButton(label, page, options = {}) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "page-button";
        button.textContent = label;
        if (options.current) button.setAttribute("aria-current", "page");
        if (options.disabled) button.disabled = true;
        button.setAttribute("aria-label", options.ariaLabel || `${page}페이지`);
        button.addEventListener("click", () => {
          if (page < 1) return;
          state.page = page;
          renderArticles();
          document.getElementById("press-list").scrollIntoView({ behavior: "smooth", block: "start" });
        });
        return button;
      }

      function renderPagination(totalPages) {
        els.pagination.replaceChildren();
        if (totalPages <= 1) {
          els.pagination.hidden = true;
          return;
        }
        els.pagination.hidden = false;
        els.pagination.appendChild(createPageButton("‹", state.page - 1, { disabled: state.page === 1, ariaLabel: "이전 페이지" }));
        const maxVisible = 5;
        let start = Math.max(1, state.page - Math.floor(maxVisible / 2));
        let end = Math.min(totalPages, start + maxVisible - 1);
        start = Math.max(1, end - maxVisible + 1);
        if (start > 1) {
          els.pagination.appendChild(createPageButton("1", 1, { current: state.page === 1 }));
          if (start > 2) {
            const dots = document.createElement("span");
            dots.className = "page-button";
            dots.textContent = "…";
            dots.setAttribute("aria-hidden", "true");
            els.pagination.appendChild(dots);
          }
        }
        for (let page = start; page <= end; page++) {
          if (start > 1 && page === 1) continue;
          els.pagination.appendChild(createPageButton(String(page), page, { current: page === state.page }));
        }
        if (end < totalPages) {
          if (end < totalPages - 1) {
            const dots = document.createElement("span");
            dots.className = "page-button";
            dots.textContent = "…";
            dots.setAttribute("aria-hidden", "true");
            els.pagination.appendChild(dots);
          }
          els.pagination.appendChild(createPageButton(String(totalPages), totalPages, { current: state.page === totalPages }));
        }
        els.pagination.appendChild(createPageButton("›", state.page + 1, { disabled: state.page === totalPages, ariaLabel: "다음 페이지" }));
      }

      function renderArticles() {
        els.grid.setAttribute("aria-busy", "false");
        const total = state.filtered.length;
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        const start = (state.page - 1) * PAGE_SIZE;
        const current = state.filtered.slice(start, start + PAGE_SIZE);
        els.resultCount.replaceChildren();
        const label = document.createTextNode("검색 결과 ");
        const count = document.createElement("strong");
        count.textContent = total.toLocaleString("ko-KR");
        const suffix = document.createTextNode("건");
        els.resultCount.append(label, count, suffix);
        els.resultNote.textContent = total ? `총 ${totalPages}페이지 · ${state.sort === "newest" ? "최신순" : "오래된순"}` : "조건에 맞는 자료가 없습니다.";

        if (!current.length) {
          const panel = document.createElement("div");
          panel.className = "status-panel";
          panel.style.gridColumn = "1 / -1";
          const icon = document.createElement("div");
          icon.className = "status-icon";
          icon.textContent = "⌕";
          icon.setAttribute("aria-hidden", "true");
          const heading = document.createElement("h2");
          heading.textContent = "검색 결과가 없습니다";
          const description = document.createElement("p");
          description.textContent = "검색어를 바꾸거나 기간 필터를 초기화해 보세요.";
          const reset = document.createElement("button");
          reset.className = "small-button";
          reset.type = "button";
          reset.textContent = "필터 초기화";
          reset.addEventListener("click", resetFilters);
          panel.append(icon, heading, description, reset);
          els.grid.replaceChildren(panel);
        } else {
          const cards = current.map((article, index) => createArticleCard(article, index));
          els.grid.replaceChildren(...cards);
        }
        renderPagination(totalPages);
      }

      function setPeriod(period) {
        state.period = period;
        state.page = 1;
        document.querySelectorAll("[data-period]").forEach(button => {
          button.setAttribute("aria-pressed", button.dataset.period === period ? "true" : "false");
        });
        els.customDates.classList.toggle("is-visible", period === "custom");
        if (period !== "custom") {
          state.customFrom = null;
          state.customTo = null;
          els.dateFrom.value = "";
          els.dateTo.value = "";
        }
        applyFilters();
      }

      function applyCustomDates() {
        const fromValue = els.dateFrom.value;
        const toValue = els.dateTo.value;
        if (fromValue && toValue && fromValue > toValue) {
          els.dateTo.setCustomValidity("종료일은 시작일보다 빠를 수 없습니다.");
          els.dateTo.reportValidity();
          els.dateTo.setCustomValidity("");
          return;
        }
        state.customFrom = fromValue ? new Date(`${fromValue}T00:00:00`) : null;
        state.customTo = toValue ? new Date(`${toValue}T23:59:59.999`) : null;
        state.page = 1;
        applyFilters();
      }

      function resetFilters() {
        els.searchInput.value = "";
        els.dateFrom.value = "";
        els.dateTo.value = "";
        els.sort.value = "newest";
        state.query = "";
        state.customFrom = null;
        state.customTo = null;
        state.page = 1;
        setPeriod("all");
      }

      els.searchForm.addEventListener("submit", event => {
        event.preventDefault();
        state.page = 1;
        applyFilters();
      });
      els.searchInput.addEventListener("input", () => {
        state.page = 1;
        applyFilters();
      });
      els.sort.addEventListener("change", () => {
        state.page = 1;
        applyFilters();
      });
      document.querySelectorAll("[data-period]").forEach(button => {
        button.addEventListener("click", () => setPeriod(button.dataset.period));
      });
      document.getElementById("apply-date").addEventListener("click", applyCustomDates);
      document.getElementById("clear-filters").addEventListener("click", resetFilters);
      document.getElementById("focus-search").addEventListener("click", () => {
        document.getElementById("press-list").scrollIntoView({ behavior: "smooth", block: "start" });
        window.setTimeout(() => els.searchInput.focus(), 250);
      });

      els.footerYear.textContent = String(new Date().getFullYear());
      renderBrand();
      renderMainNav();
      // 정렬 필드의 동작을 화면에 표시하기 위한 접근성용 설명입니다.
      els.resultNote.textContent = "최신 보도자료부터 표시합니다.";
      loadArticles();
    })();
  </script>
</body>
</html>
